<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistente de Física 1</title>
  <link rel="stylesheet" href="/style.css">
  <!-- KaTeX renders LaTeX math that the assistant streams back (e.g. $F = ma$). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
  <main class="chat-container">
    <header class="chat-header">
      <h1>Asistente de Física 1</h1>
      <p class="subtitle">Respondemos desde los apuntes del curso</p>
    </header>

    <ul id="messages" class="messages" aria-live="polite"></ul>

    <div id="name-area" class="name-area">
      <input
        id="student-name"
        type="text"
        autocomplete="off"
        maxlength="100"
        placeholder="Escribí tu nombre para empezar..."
        aria-label="Nombre"
      />
      <button type="button" id="name-submit">Entrar</button>
    </div>

    <form id="chat-form" class="input-area">
      <input
        id="query"
        type="text"
        name="query"
        autocomplete="off"
        maxlength="500"
        placeholder="Escribí tu pregunta de Física 1..."
        aria-label="Pregunta"
        disabled
      />
      <button type="submit" id="send-btn" disabled>Enviar</button>
    </form>

    <div id="hint" class="hint" role="status" aria-live="assertive"></div>
  </main>

  <!-- KaTeX (core + auto-render extension) loads before chat.js so the helper can call renderMathInElement. -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="/chat.js"></script>
</body>
</html>
