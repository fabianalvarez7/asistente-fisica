name: Keep HF Space alive

on:
  # HF Spaces free tier sleeps the container after 48h of inactivity.
  # 12h gives 4 pings per day, more than enough margin for the demo
  # week (Wed–Fri). UTC times: 00:00 and 12:00 = 21:00 and 09:00 ART.
  schedule:
    - cron: '0 */12 * * *'
  # Manual trigger so we can verify the workflow without waiting for
  # the cron schedule.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the Space without touching Turso
        run: |
          set -euo pipefail

          SPACE_URL="https://fabianalvarez7-asistente-fisica-unr.hf.space"

          # GET /topics is a read-only warm-up. It deliberately does not call
          # /history because the keepalive job must not create a synthetic
          # student, write a welcome message, or exercise Turso. This:
          #   1. Wakes the HF Space container if it was asleep.
          #   2. Confirms that the public app can answer a cheap request.
          # Keeping the warm-up write-free avoids coupling Space wake-up to
          # history availability and avoids polluting the conversation store.
          # If /topics returns 200, the Space is reachable. If it returns
          # anything else, the Space is broken (and the demo will need a
          # manual restart from the HF UI).
          response=$(curl -sS -o /tmp/keepalive.json \
            -w "%{http_code}" \
            --max-time 30 \
            "${SPACE_URL}/topics")

          if [ "$response" != "200" ]; then
            echo "::error::Space returned HTTP $response, expected 200"
            exit 1
          fi

          echo "Space returned 200"
          echo "--- response body (first 200 bytes) ---"
          head -c 200 /tmp/keepalive.json
          echo ""
